name: CRM quality

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Pages build
        run: npm run build:pages
      - name: Real Pages Functions and D1 integration
        run: |
          npm exec --yes --package=wrangler@4.148.0 -- wrangler d1 migrations apply podologymk_crm_staging --local --config wrangler.staging.jsonc --persist-to .wrangler/e2e
          npm exec --yes --package=wrangler@4.148.0 -- wrangler d1 execute podologymk_crm_staging --local --config wrangler.staging.jsonc --persist-to .wrangler/e2e --file scripts/staging-fixture.sql
          stage_dir=$(mktemp -d "$PWD/.wrangler/e2e-pages.XXXXXX")
          ln -s "$PWD/functions" "$PWD/src" "$PWD/out" "$PWD/package.json" "$stage_dir/"
          ln -s "$PWD/wrangler.staging.jsonc" "$stage_dir/wrangler.jsonc"
          npm exec --yes --package=wrangler@4.148.0 -- wrangler --cwd "$stage_dir" pages dev out --ip 127.0.0.1 --port 8790 --persist-to "$PWD/.wrangler/e2e" --binding TELEGRAM_BOT_TOKEN=local-qa-token --binding CRM_OWNER_TELEGRAM_ID=990000001 --binding CRM_ALLOWED_TELEGRAM_IDS=990000001 --binding TELEGRAM_WEBHOOK_SECRET=local-qa-webhook > .wrangler/api-e2e.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/api/health; then break; fi
            sleep 1
          done
          npm run qa:api
      - name: Install browser for UI checks
        run: npx --yes --package=playwright playwright install --with-deps chromium
      - name: Browser UI checks
        run: |
          node scripts/serve-export.mjs &
          npx --yes --package=playwright -c 'PLAYWRIGHT_MODULE="$(dirname "$(command -v playwright)")/../playwright" npm run qa:ui'
