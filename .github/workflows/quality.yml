name: CRM quality

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Pages build
        run: npm run build:pages
      - name: Install browser for UI checks
        run: npx --yes --package=playwright playwright install --with-deps chromium
      - name: Browser UI checks
        run: |
          node scripts/serve-export.mjs &
          npx --yes --package=playwright -c 'PLAYWRIGHT_MODULE="$(dirname "$(command -v playwright)")/../playwright" npm run qa:ui'
