name: CRM quality

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling security audit
        run: npm audit --audit-level=high
      - name: Generate and validate Prisma reference schema
        run: |
          npm run db:generate
          npm run db:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Pages build
        run: npm run build:pages
      - name: Real Pages Functions and D1 integration
        run: npm run qa:api
      - name: Install browser for UI checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser UI checks
        run: |
          node scripts/serve-export.mjs &
          npm run qa:ui
